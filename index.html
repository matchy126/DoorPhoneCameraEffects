<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドアホンカメラ</title>
<style>
:root{--bg:#e9ecef;--fg:#1b1f24;--card:#fff;--ac:#1f9d6b;--mute:#6b7480;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--fg:#e6e9ec;--card:#1f2428;--mute:#8d97a3}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#e6e9ec;--card:#1f2428;--mute:#8d97a3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
.unit{width:100%;max-width:720px;border-radius:6px}.unit.bz{background:#d8d8d4;border-radius:22px;padding:16px 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);border:2px solid #b9b9b3}
.screen{position:relative;overflow:hidden;background:#000;aspect-ratio:4/3}.screen:not(.ov) .o{display:none}.unit:not(.bz) .led{display:none}
canvas{width:100%;height:100%;display:block}
.o{position:absolute;color:#fff;font:600 13px/1.2 ui-monospace,Menlo,monospace;text-shadow:0 0 3px #000,1px 1px 0 #000;pointer-events:none}
#rec{top:8px;left:10px}#rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e33;margin-right:5px;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
#ch{top:8px;right:10px}#ts{bottom:8px;right:10px}#vis{bottom:8px;left:10px;font-size:15px;color:#ffe45c;opacity:0}
.led{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#555;font-size:11px;letter-spacing:.2em}
.led b{width:8px;height:8px;border-radius:50%;background:#3c3;box-shadow:0 0 6px #3c3}
.panel{width:100%;max-width:720px;margin-top:14px;background:var(--card);border-radius:14px;padding:14px}
label{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
label span{width:5.5em}input[type=range]{flex:1;accent-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,.fb{font:inherit;font-size:14px;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s,.fb{background:transparent;color:var(--fg);border:1px solid var(--mute)}
#msg{font-size:12px;color:var(--mute);margin-top:8px;min-height:1.2em}
</style></head><body>
<div class="unit" id="unit">
 <div class="screen" id="scr"><canvas id="c" width="640" height="480"></canvas>
  <div class="o" id="rec"><i></i>REC</div><div class="o" id="ch">玄関 CH1</div>
  <div class="o" id="ts"></div><div class="o" id="vis">● 来客あり</div></div>
 <div class="led"><span>DOOR PHONE</span><b></b></div>
</div>
<div class="panel">
 <label><span>歪み</span><input type="range" id="d" min="0" max="1" step=".01" value="1"></label>
 <label><span>画質劣化</span><input type="range" id="p" min="0" max="1" step=".01" value=".5"></label>
 <label><span>色の濃さ</span><input type="range" id="s" min="0" max="1" step=".01" value=".6"></label>
 <label><span>ノイズ</span><input type="range" id="n" min="0" max="1" step=".01" value=".4"></label>
 <div class="row">
  <button id="cam">カメラ起動</button>
  <label class="fb" style="margin:0">画像・動画を選ぶ<input id="f" type="file" accept="image/*,video/*" hidden></label>
  <button class="s" id="nv">暗視: OFF</button>
  <button class="s" id="ov">ドアホン表示: OFF</button>
 </div>
 <div id="msg">カメラが使えないときは、仮の映像が流れます。</div>
</div>
<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl');
const $=id=>document.getElementById(id);
const VS='attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
const FS=`precision mediump float;varying vec2 v;uniform sampler2D t;uniform float time,dist,pix,nz,night,sat;uniform vec2 sc;
float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
const vec3 w=vec3(.3,.59,.11);
vec2 mp(vec2 q){vec2 p=q*2.-1.;vec2 hf=vec2(1.4835,.9599)*max(dist,.02);p=tan(p*hf)/tan(hf);return p*.5*sc+.5;}
void main(){
 vec2 res=vec2(640.,480.);
 vec3 c=texture2D(t,mp(v)).rgb;
 c=(c-.5)*1.2+.5;float l=dot(c,w);
 c=mix(vec3(l),c,mix(1.,1.9,sat));
 c=mix(c,vec3(.1,1.,.3)*pow(clamp(l*1.8,0.,1.),.9),night);
 float n=mix(48.,9.,pix);c=floor(c*n+.5)/n;
 c+=(h(v*res+time)-.5)*nz*.35;
 c*=1.-.35*smoothstep(.7,1.5,length(v*2.-1.));
 gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const U=n=>gl.getUniformLocation(pr,n);
// 仮の映像(カメラが無いとき)
const fb=document.createElement('canvas');fb.width=960;fb.height=540;const fx=fb.getContext('2d');
function fake(t){
 const gr=fx.createLinearGradient(0,0,0,540);gr.addColorStop(0,'#8fa6b8');gr.addColorStop(1,'#4d5a63');
 fx.fillStyle=gr;fx.fillRect(0,0,960,540);
 fx.fillStyle='#6b4a32';fx.fillRect(40,60,150,330);fx.fillStyle='#d9b74a';fx.fillRect(160,220,12,12);
 fx.fillStyle='#3d4a40';fx.fillRect(0,430,960,110);
 const x=480+Math.sin(t*.5)*240;
 fx.fillStyle='#2b2f3a';fx.beginPath();fx.ellipse(x,330,48,120,0,0,7);fx.fill();
 fx.fillStyle='#e0b99a';fx.beginPath();fx.arc(x,190,32,0,7);fx.fill();
}
let src=null,kind='fake',vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.loop=true;
function msg(s){$('msg').textContent=s}
$('cam').onclick=async()=>{
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});
  vid.srcObject=s;await vid.play();kind='video';msg('カメラ映像を加工中です。')}
 catch(e){msg('カメラを使えませんでした。許可を確認するか、画像・動画を選んでください。')}};
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);
 if(f.type.startsWith('video')){vid.srcObject=null;vid.src=u;vid.play();kind='video'}
 else{const im=new Image();im.onload=()=>{src=im;kind='image'};im.src=u}
 msg(f.name+' を加工中です。')};
let night=0;$('nv').onclick=()=>{night=1-night;$('nv').textContent='暗視: '+(night?'ON':'OFF')};
let ovb=0;$('ov').onclick=()=>{ovb=1-ovb;$('unit').classList.toggle('bz',!!ovb);$('scr').classList.toggle('ov',!!ovb);$('ov').textContent='ドアホン表示: '+(ovb?'ON':'OFF')};
const p2=n=>String(n).padStart(2,'0');
function loop(ms){
 const t=ms/1000;let s;
 if(kind==='video'&&vid.readyState>=2)s=vid;else if(kind==='image')s=src;else{fake(t);s=fb}
 gl.bindTexture(gl.TEXTURE_2D,tx);
 try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,s)}catch(e){}
 gl.uniform1f(U('time'),t%100);gl.uniform1f(U('dist'),+$('d').value);gl.uniform1f(U('pix'),+$('p').value);
 gl.uniform1f(U('nz'),+$('n').value);gl.uniform1f(U('sat'),+$('s').value);
 const sw=s.videoWidth||s.naturalWidth||s.width||960,sh2=s.videoHeight||s.naturalHeight||s.height||540,sa=sw/sh2,ca=4/3;
 gl.uniform2f(U('sc'),sa>ca?ca/sa:1,sa>ca?1:sa/ca);gl.uniform1f(U('night'),night);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 const n=new Date();$('ts').textContent=`${n.getFullYear()}/${p2(n.getMonth()+1)}/${p2(n.getDate())} ${p2(n.getHours())}:${p2(n.getMinutes())}:${p2(n.getSeconds())}`;
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
